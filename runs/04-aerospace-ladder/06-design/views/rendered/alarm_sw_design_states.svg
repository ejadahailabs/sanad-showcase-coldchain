everse"><path d="M8,7 L3.79,3.46 A5.5,5.5 0 1 1 3.79,10.54 Z" fill="context-stroke" stroke="context-stroke" stroke-width="1.111"/></marker></defs><g id="zoom"><rect class="fr" x="4" y="2" width="1548" height="891" rx="10"/><rect class="frt" x="4" y="2" width="518" height="18" rx="2"/><text class="frn" x="12" y="14.5">«view» alarm_sw_design_states : StandardViewDefinitions::StateTransitionView</text><g class="nd" tabindex="0" role="button" aria-pressed="false" aria-label="state def AlarmStates" data-el="MrtmSwStates::AlarmStates" data-x="24" data-y="44" data-w="1508" data-h="829" transform="translate(24,44)"><rect class="bx" width="1508" height="829" rx="2"/><rect class="hd" x="1" y="1" width="1506" height="33" rx="1"/><text class="kk kw" x="754" y="11.5" text-anchor="middle">«state def»</text><text class="nn bd" x="754" y="27" text-anchor="middle">AlarmStates</text><path class="rule" d="M0,712 H1508"/><text class="kk cl" x="754" y="722" text-anchor="middle">doc</text><text class="ft" x="7" y="736">One per alarm manager. Every 1 s cycle the</text><text class="ft" x="7" y="751">alarm task runs one step of this machine</text><text class="ft" x="7" y="766">and beats the heartbeat (MRTM-SAF-010).</text><path class="rule" d="M0,778 H1508"/><text class="kk cl" x="754" y="788" text-anchor="middle">attributes</text><text class="ft" x="7" y="802">silencedSeconds : Natural</text><text class="ft" x="7" y="817">realarmSeconds : Natural</text><g class="nd in wk" aria-label="initial transition, unnamed" data-x="768" data-y="96" data-w="18" data-h="18" transform="translate(744,52)"><circle cx="9" cy="9" r="9" fill="var(--ink)"/></g><g class="nd in" data-el="MrtmSwStates::AlarmStates::quiet" data-inner="1" aria-pressed="false" aria-label="state quiet" data-x="688" data-y="164" data-w="176" data-h="103" transform="translate(664,120)"><rect class="bx" width="176" height="103" rx="10"/><rect class="hd" x="1" y="1" width="174" height="33" rx="1"/><text class="kk kw" x="88" y="11.5" text