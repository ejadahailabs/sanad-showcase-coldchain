" y="89">5 s (MRTM-SAF-002).</text><path class="rule" d="M0,101 H300"/><text class="kk cl" x="150" y="111" text-anchor="middle">state actions</text><text class="ft" x="7" y="125">entry startProbeFaultPattern</text></g><g class="nd in" data-el="MrtmSwStates::AlarmStates::buzzerFault" data-inner="1" aria-pressed="false" aria-label="state buzzerFault" data-x="1236" data-y="556" data-w="280" data-h="154" transform="translate(1212,512)"><rect class="bx" width="280" height="154" rx="10"/><rect class="hd" x="1" y="1" width="278" height="33" rx="1"/><text class="kk kw" x="140" y="11.5" text-anchor="middle">«state»</text><text class="nn bd" x="140" y="27" text-anchor="middle">buzzerFault</text><path class="rule" d="M0,35 H280"/><text class="kk cl" x="140" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">Red LED 4 Hz within 5 s (MRTM-SAF-015);</text><text class="ft" x="7" y="74">the backup alarm stays armed.</text><path class="rule" d="M0,86 H280"/><text class="kk cl" x="140" y="96" text-anchor="middle">state actions</text><text class="ft" x="7" y="110">entry flashRedFast</text></g></g><path class="ed" d="M688,208.5 L447,208.5 Q441,208.5 441,214.5 L441,391.5 Q441,397.5 435,397.5 L320,397.5" data-el="MrtmSwStates::AlarmStates::quiet" data-edge="MrtmSwStates::AlarmStates::early&gt;transition" data-from="MrtmSwStates::AlarmStates::quiet" data-to="MrtmSwStates::AlarmStates::early" marker-end="url(#ar)"/><text class="edl" x="531" y="203.5" text-anchor="middle" data-word="MrtmSwStates::AlarmStates::quiet|MrtmSwStates::AlarmStates::early&gt;transition">ExcursionEarly</text><path class="ed" d="M320,411.5 L449,411.5 Q455,411.5 455,405.5 L455,228.5 Q455,222.5 461,222.5 L688,222.5" data-el="MrtmSwStates::AlarmStates::early" data-edge="MrtmSwStates::AlarmStates::quiet&gt;transition" data-from="MrtmSwStates::AlarmStates::early" data-to="MrtmSwStates::AlarmStates::quiet" marker-end="url(#ar)"/><text class="edl" x="531" y="188.5" text-anchor="middle" data-word="MrtmSwStat