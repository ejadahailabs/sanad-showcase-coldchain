<svg class="pic cls dcl" id="pic" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9" fill="none" stroke="context-stroke" stroke-width="1.111"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10.8" markerHeight="10.8" orient="auto-start-reverse"><path d="M0,0.5 L11,6 L0,11.5 Z" fill="var(--panel)" stroke="context-stroke" stroke-width="1.111"/></marker><marker id="far" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" fill="context-stroke" stroke="context-stroke" stroke-width="1.111" stroke-linejoin="round"/></marker><marker id="trid" viewBox="0 0 16 12" refX="15" refY="6" markerWidth="14.4" markerHeight="10.8" orient="auto-start-reverse"><path d="M4,0.5 L15,6 L4,11.5 Z" fill="var(--panel)" stroke="context-stroke" stroke-width="1.111"/><circle cx="1.8" cy="3.4" r="1.1" fill="context-stroke"/><circle cx="1.8" cy="8.6" r="1.1" fill="context-stroke"/></marker><marker id="trib" viewBox="0 0 14 12" refX="13" refY="6" markerWidth="12.6" markerHeight="10.8" orient="auto-start-reverse"><path d="M3,0.5 L13,6 L3,11.5 Z" fill="var(--panel)" stroke="context-stroke" stroke-width="1.111"/><path d="M1.3,0.8 V11.2" fill="none" stroke="context-stroke" stroke-width="1.111"/></marker><marker id="dia" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12.6" markerHeight="9" orient="auto-start-reverse"><path d="M0,5 L6,1 L13,5 L6,9 Z" fill="context-stroke" stroke="context-stroke" stroke-width="1.111"/></marker><marker id="odia" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12.6" markerHeight="9" orient="auto-start-reverse"><path d="M0,5 L6,1 L13,5 L6,9 Z" fill="var(--panel)" stroke="context-stroke" stroke-width="1.111"/></marker><marker id="por" viewBox="0 0 14 14" refX="13.5" refY="7" markerWidth="12.6" markerHeight="12.6" orient="auto-start-reverse"><path d="M8,7 L3.79,3.46 A5.5,5.5 0 1 1 3.79,10.54 Z" fill="context-stroke" stroke="context-stroke" stroke-width="1.111"/></marker></defs><g id="zoom"><rect class="fr" x="4" y="2" width="1024" height="1683" rx="10"/><rect class="frt" x="4" y="2" width="426" height="18" rx="2"/><text class="frn" x="12" y="14.5">«view» mrtmSafetyBlocks : StandardViewDefinitions::GeneralView</text><g class="nd" tabindex="0" role="button" aria-pressed="false" aria-label="concern def Hazard" data-el="MrtmSafety::Hazard" data-x="372" data-y="836" data-w="300" data-h="242" transform="translate(372,836)"><rect class="bx" width="300" height="242" rx="2"/><rect class="hd" x="1" y="1" width="298" height="33" rx="1"/><text class="kk kw" x="150" y="11.5" text-anchor="middle">«concern def»</text><text class="nn bd" x="150" y="27" text-anchor="middle">Hazard</text><path class="rule" d="M0,35 H300"/><text class="kk cl" x="150" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">A hazard with its hazardous situation and</text><text class="ft" x="7" y="74">harm (ISO 14971 cl. 3.4, 3.5, 5.4).</text><text class="ft" x="7" y="89">severity 1 minor, 2 serious, 3 critical;</text><text class="ft" x="7" y="104">probability 1 remote, 2 occasional, 3</text><text class="ft" x="7" y="119">probable; risk = severity x probability;</text><text class="ft" x="7" y="134">1-2 acceptable, 3-4 review (reduce as far</text><text class="ft" x="7" y="149">as possible), 6-9 unacceptable (ADR-0012).</text><path class="rule" d="M0,161 H300"/><text class="kk cl" x="150" y="171" text-anchor="middle">attributes</text><text class="ft" x="7" y="185">hazardId : String</text><text class="ft" x="7" y="200">severity : Integer</text><text class="ft" x="7" y="215">probability : Integer</text><text class="ft" x="7" y="230">residualProbability : Integer</text></g><g class="nd" tabindex="0" role="button" aria-pressed="false" aria-label="concern HAZ-001" data-el="MrtmSafety::HAZ-001" data-x="376" data-y="572" data-w="288" data-h="212" transform="translate(376,572)"><rect class="bx" width="288" height="212" rx="10"/><rect class="hd" x="1" y="1" width="286" height="33" rx="1"/><text class="kk kw" x="144" y="11.5" text-anchor="middle">«concern»</text><text class="nn bd" x="144" y="27" text-anchor="middle">HAZ-001 : Hazard</text><path class="rule" d="M0,35 H288"/><text class="kk cl" x="144" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">Excursion not detected: the probe reads</text><text class="ft" x="7" y="74">in-band while the air is out of band</text><text class="ft" x="7" y="89">(probe damaged, loose, badly placed, bus</text><text class="ft" x="7" y="104">errors). Harm: patients receive vaccine</text><text class="ft" x="7" y="119">with lost potency.</text><path class="rule" d="M0,131 H288"/><text class="kk cl" x="144" y="141" text-anchor="middle">attributes</text><text class="ft" x="7" y="155">:&gt;&gt; hazardId = &quot;HAZ-001&quot;</text><text class="ft" x="7" y="170">:&gt;&gt; severity = 3</text><text class="ft" x="7" y="185">:&gt;&gt; probability = 2</text><text class="ft" x="7" y="200">:&gt;&gt; residualProbability = 1</text></g><g class="nd" tabindex="0" role="button" aria-pressed="false" aria-label="concern HAZ-002" data-el="MrtmSafety::HAZ-002" data-x="24" data-y="44" data-w="280" data-h="212" transform="translate(24,44)"><rect class="bx" width="280" height="212" rx="10"/><rect class="hd" x="1" y="1" width="278" height="33" rx="1"/><text class="kk kw" x="140" y="11.5" text-anchor="middle">«concern»</text><text class="nn bd" x="140" y="27" text-anchor="middle">HAZ-002 : Hazard</text><path class="rule" d="M0,35 H280"/><text class="kk cl" x="140" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">Alarm fatigue: nuisance or confusing</text><text class="ft" x="7" y="74">alarms teach staff to ignore or silence</text><text class="ft" x="7" y="89">the buzzer, so a real excursion is not</text><text class="ft" x="7" y="104">acted on. Harm: delayed action, spoiled</text><text class="ft" x="7" y="119">stock used or lost.</text><path class="rule" d="M0,131 H280"/><text class="kk cl" x="140" y="141" text-anchor="middle">attributes</text><text class="ft" x="7" y="155">:&gt;&gt; hazardId = &quot;HAZ-002&quot;</text><text class="ft" x="7" y="170">:&gt;&gt; severity = 2</text><text class="ft" x="7" y="185">:&gt;&gt; probability = 3</text><text class="ft" x="7" y="200">:&gt;&gt; residualProbability = 2</text></g><g class="nd" tabindex="0" role="button" aria-pressed="false" aria-label="concern HAZ-003" data-el="MrtmSafety::HAZ-003" data-x="352" data-y="44" data-w="300" data-h="212" transform="translate(352,44)"><rect class="bx" width="300" height="212" rx="10"/><rect class="hd" x="1" y="1" width="298" height="33" rx="1"/><text class="kk kw" x="150" y="11.5" text-anchor="middle">«concern»</text><text class="nn bd" x="150" y="27" text-anchor="middle">HAZ-003 : Hazard</text><path class="rule" d="M0,35 H300"/><text class="kk cl" x="150" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">Silent failure: the firmware hangs or the</text><text class="ft" x="7" y="74">processor dies, so no alarm can sound and</text><text class="ft" x="7" y="89">the screen may freeze on a good value.</text><text class="ft" x="7" y="104">Harm: an excursion goes unalarmed; vaccine</text><text class="ft" x="7" y="119">with lost potency is used.</text><path class="rule" d="M0,131 H300"/><text class="kk cl" x="150" y="141" text-anchor="middle">attributes</text><text class="ft" x="7" y="155">:&gt;&gt; hazardId = &quot;HAZ-003&quot;</text><text class="ft" x="7" y="170">:&gt;&gt; severity = 3</text><text class="ft" x="7" y="185">:&gt;&gt; probability = 2</text><text class="ft" x="7" y="200">:&gt;&gt; residualProbability = 1</text></g><g class="nd" tabindex="0" role="button" aria-pressed="false" aria-label="concern HAZ-004" data-el="MrtmSafety::HAZ-004" data-x="696" data-y="44" data-w="300" data-h="197" transform="translate(696,44)"><rect class="bx" width="300" height="197" rx="10"/><rect class="hd" x="1" y="1" width="298" height="33" rx="1"/><text class="kk kw" x="150" y="11.5" text-anchor="middle">«concern»</text><text class="nn bd" x="150" y="27" text-anchor="middle">HAZ-004 : Hazard</text><path class="rule" d="M0,35 H300"/><text class="kk cl" x="150" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">Sensor drift: the probe slowly reads wrong</text><text class="ft" x="7" y="74">inside its plausible range, so the band</text><text class="ft" x="7" y="89">edge moves without anyone seeing it. Harm:</text><text class="ft" x="7" y="104">an excursion near the band edge is missed.</text><path class="rule" d="M0,116 H300"/><text class="kk cl" x="150" y="126" text-anchor="middle">attributes</text><text class="ft" x="7" y="140">:&gt;&gt; hazardId = &quot;HAZ-004&quot;</text><text class="ft" x="7" y="155">:&gt;&gt; severity = 3</text><text class="ft" x="7" y="170">:&gt;&gt; probability = 2</text><text class="ft" x="7" y="185">:&gt;&gt; residualProbability = 1</text></g><g class="nd" tabindex="0" role="button" aria-pressed="false" aria-label="concern HAZ-005" data-el="MrtmSafety::HAZ-005" data-x="24" data-y="308" data-w="296" data-h="212" transform="translate(24,308)"><rect class="bx" width="296" height="212" rx="10"/><rect class="hd" x="1" y="1" width="294" height="33" rx="1"/><text class="kk kw" x="148" y="11.5" text-anchor="middle">«concern»</text><text class="nn bd" x="148" y="27" text-anchor="middle">HAZ-005 : Hazard</text><path class="rule" d="M0,35 H296"/><text class="kk cl" x="148" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">Power loss: mains fails and the battery</text><text class="ft" x="7" y="74">runs flat, so the monitor stops while the</text><text class="ft" x="7" y="89">fridge also warms. Harm: an unmonitored</text><text class="ft" x="7" y="104">excursion; vaccine with lost potency is</text><text class="ft" x="7" y="119">used.</text><path class="rule" d="M0,131 H296"/><text class="kk cl" x="148" y="141" text-anchor="middle">attributes</text><text class="ft" x="7" y="155">:&gt;&gt; hazardId = &quot;HAZ-005&quot;</text><text class="ft" x="7" y="170">:&gt;&gt; severity = 3</text><text class="ft" x="7" y="185">:&gt;&gt; probability = 3</text><text class="ft" x="7" y="200">:&gt;&gt; residualProbability = 1</text></g><g class="nd" tabindex="0" role="button" aria-pressed="false" aria-label="concern HAZ-006" data-el="MrtmSafety::HAZ-006" data-x="368" data-y="308" data-w="296" data-h="212" transform="translate(368,308)"><rect class="bx" width="296" height="212" rx="10"/><rect class="hd" x="1" y="1" width="294" height="33" rx="1"/><text class="kk kw" x="148" y="11.5" text-anchor="middle">«concern»</text><text class="nn bd" x="148" y="27" text-anchor="middle">HAZ-006 : Hazard</text><path class="rule" d="M0,35 H296"/><text class="kk cl" x="148" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">Annunciator failure: the buzzer, the red</text><text class="ft" x="7" y="74">light or the display is broken or not</text><text class="ft" x="7" y="89">perceived, so a detected excursion is not</text><text class="ft" x="7" y="104">noticed. Harm: an excursion goes</text><text class="ft" x="7" y="119">unnoticed.</text><path class="rule" d="M0,131 H296"/><text class="kk cl" x="148" y="141" text-anchor="middle">attributes</text><text class="ft" x="7" y="155">:&gt;&gt; hazardId = &quot;HAZ-006&quot;</text><text class="ft" x="7" y="170">:&gt;&gt; severity = 3</text><text class="ft" x="7" y="185">:&gt;&gt; probability = 2</text><text class="ft" x="7" y="200">:&gt;&gt; residualProbability = 1</text></g><g class="nd" tabindex="0" role="button" aria-pressed="false" aria-label="concern HAZ-007" data-el="MrtmSafety::HAZ-007" data-x="708" data-y="308" data-w="300" data-h="197" transform="translate(708,308)"><rect class="bx" width="300" height="197" rx="10"/><rect class="hd" x="1" y="1" width="298" height="33" rx="1"/><text class="kk kw" x="150" y="11.5" text-anchor="middle">«concern»</text><text class="nn bd" x="150" y="27" text-anchor="middle">HAZ-007 : Hazard</text><path class="rule" d="M0,35 H300"/><text class="kk cl" x="150" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">Wrong limits: the stored allowed band is</text><text class="ft" x="7" y="74">wrong or corrupted, so the monitor watches</text><text class="ft" x="7" y="89">the wrong range. Harm: a real excursion is</text><text class="ft" x="7" y="104">judged in-band.</text><path class="rule" d="M0,116 H300"/><text class="kk cl" x="150" y="126" text-anchor="middle">attributes</text><text class="ft" x="7" y="140">:&gt;&gt; hazardId = &quot;HAZ-007&quot;</text><text class="ft" x="7" y="155">:&gt;&gt; severity = 3</text><text class="ft" x="7" y="170">:&gt;&gt; probability = 2</text><text class="ft" x="7" y="185">:&gt;&gt; residualProbability = 1</text></g><g class="nd" tabindex="0" role="button" aria-pressed="false" aria-label="concern HAZ-008" data-el="MrtmSafety::HAZ-008" data-x="24" data-y="572" data-w="300" data-h="197" transform="translate(24,572)"><rect class="bx" width="300" height="197" rx="10"/><rect class="hd" x="1" y="1" width="298" height="33" rx="1"/><text class="kk kw" x="150" y="11.5" text-anchor="middle">«concern»</text><text class="nn bd" x="150" y="27" text-anchor="middle">HAZ-008 : Hazard</text><path class="rule" d="M0,35 H300"/><text class="kk cl" x="150" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">History loss: excursion records are lost</text><text class="ft" x="7" y="74">or corrupted, so the audit cannot show</text><text class="ft" x="7" y="89">that stock was exposed. Harm: exposed</text><text class="ft" x="7" y="104">stock is used, or good stock is discarded.</text><path class="rule" d="M0,116 H300"/><text class="kk cl" x="150" y="126" text-anchor="middle">attributes</text><text class="ft" x="7" y="140">:&gt;&gt; hazardId = &quot;HAZ-008&quot;</text><text class="ft" x="7" y="155">:&gt;&gt; severity = 2</text><text class="ft" x="7" y="170">:&gt;&gt; probability = 2</text><text class="ft" x="7" y="185">:&gt;&gt; residualProbability = 1</text></g><g class="nd" tabindex="0" role="button" aria-pressed="false" aria-label="part def MrtmRiskControls" data-el="MrtmSafety::MrtmRiskControls" data-x="24" data-y="1132" data-w="300" data-h="533" transform="translate(24,1132)"><rect class="bx" width="300" height="533" rx="2"/><rect class="hd" x="1" y="1" width="298" height="33" rx="1"/><text class="kk kw" x="150" y="11.5" text-anchor="middle">«part def»</text><text class="nn bd" x="150" y="27" text-anchor="middle">MrtmRiskControls</text><path class="rule" d="M0,35 H300"/><text class="kk cl" x="150" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">The system with each new risk control</text><text class="ft" x="7" y="74">allocated to the part that implements it</text><text class="ft" x="7" y="89">(ISO 14971 cl. 7.2). Controls</text><text class="ft" x="7" y="104">MRTM-SAF-001, -004, -008 are allocated in</text><text class="ft" x="7" y="119">MrtmPhysical and MrtmPartitions (Phase 4).</text><path class="rule" d="M0,131 H300"/><text class="kk cl" x="150" y="141" text-anchor="middle">parts</text><text class="ft" x="7" y="155">^hardware : MrtmUnit</text><text class="ft" x="7" y="170">^firmware : MonitoringFirmware</text><text class="ft" x="7" y="185">^functions : LogicalMonitor</text><path class="rule" d="M0,197 H300"/><text class="kk cl" x="150" y="207" text-anchor="middle">satisfy requirements</text><text class="ft" x="7" y="221">satisfy MRTM-SAF-009</text><text class="ft" x="7" y="236">satisfy MRTM-SAF-009</text><text class="ft" x="7" y="251">satisfy MRTM-SAF-009</text><text class="ft" x="7" y="266">satisfy MRTM-SAF-010</text><text class="ft" x="7" y="281">satisfy MRTM-SAF-010</text><text class="ft" x="7" y="296">satisfy MRTM-SAF-011</text><text class="ft" x="7" y="311">satisfy MRTM-SAF-012</text><text class="ft" x="7" y="326">satisfy MRTM-SAF-013</text><text class="ft" x="7" y="341">satisfy MRTM-SAF-013</text><text class="ft" x="7" y="356">satisfy MRTM-SAF-014</text><text class="ft" x="7" y="371">satisfy MRTM-SAF-014</text><text class="ft" x="7" y="386">satisfy MRTM-SAF-015</text><text class="ft" x="7" y="401">satisfy MRTM-SAF-015</text><text class="ft" x="7" y="416">satisfy MRTM-SAF-016</text><text class="ft" x="7" y="431">satisfy MRTM-SAF-017</text><text class="ft" x="7" y="446">satisfy MRTM-SAF-018</text><text class="ft" x="7" y="461">satisfy MRTM-SAF-002</text><text class="ft" x="7" y="476">satisfy MRTM-SAF-003</text><text class="ft" x="7" y="491">satisfy MRTM-SAF-005</text><text class="ft" x="7" y="506">satisfy MRTM-SAF-006</text><text class="ft" x="7" y="521">satisfy MRTM-SAF-007</text></g><path class="ed" d="M520,784 L520,791 Q520,796 525,796 L525,796 Q530,796 530,801 L530,836" data-el="MrtmSafety::HAZ-001" data-edge="MrtmSafety::Hazard&gt;defined by" data-from="MrtmSafety::HAZ-001" data-to="MrtmSafety::Hazard" marker-end="url(#trid)"/><path class="ed" d="M304,150 L334,150 Q340,150 340,156 L340,790 Q340,796 346,796 L492,796 Q498,796 498,802 L498,836" data-el="MrtmSafety::HAZ-002" data-edge="MrtmSafety::Hazard&gt;defined by" data-from="MrtmSafety::HAZ-002" data-to="MrtmSafety::Hazard" marker-end="url(#trid)"/><path class="ed" d="M502,256 L502,290 Q502,296 496,296 L362,296 Q356,296 356,302 L356,951 Q356,957 362,957 L372,957" data-el="MrtmSafety::HAZ-003" data-edge="MrtmSafety::Hazard&gt;defined by" data-from="MrtmSafety::HAZ-003" data-to="MrtmSafety::Hazard" marker-end="url(#trid)"/><path class="ed" d="M696,142.5 L682,142.5 Q676,142.5 676,148.5 L676,790 Q676,796 670,796 L552,796 Q546,796 546,802 L546,836" data-el="MrtmSafety::HAZ-004" data-edge="MrtmSafety::Hazard&gt;defined by" data-from="MrtmSafety::HAZ-004" data-to="MrtmSafety::Hazard" marker-end="url(#trid)"/><path class="ed" d="M320,414 L350,414 Q356,414 356,420 L356,790 Q356,796 362,796 L508,796 Q514,796 514,802 L514,836" data-el="MrtmSafety::HAZ-005" data-edge="MrtmSafety::Hazard&gt;defined by" data-from="MrtmSafety::HAZ-005" data-to="MrtmSafety::Hazard" marker-end="url(#trid)"/><path class="ed" d="M516,520 L516,554 Q516,560 510,560 L366,560 Q360,560 360,566 L360,951 Q360,957 366,957 L372,957" data-el="MrtmSafety::HAZ-006" data-edge="MrtmSafety::Hazard&gt;defined by" data-from="MrtmSafety::HAZ-006" data-to="MrtmSafety::Hazard" marker-end="url(#trid)"/><path class="ed" d="M858,505 L858,951 Q858,957 852,957 L672,957" data-el="MrtmSafety::HAZ-007" data-edge="MrtmSafety::Hazard&gt;defined by" data-from="MrtmSafety::HAZ-007" data-to="MrtmSafety::Hazard" marker-end="url(#trid)"/><path class="ed" d="M174,769 L174,967 Q174,973 180,973 L372,973" data-el="MrtmSafety::HAZ-008" data-edge="MrtmSafety::Hazard&gt;defined by" data-from="MrtmSafety::HAZ-008" data-to="MrtmSafety::Hazard" marker-end="url(#trid)"/></g></svg>