everse"><path d="M8,7 L3.79,3.46 A5.5,5.5 0 1 1 3.79,10.54 Z" fill="context-stroke" stroke="context-stroke" stroke-width="1.111"/></marker></defs><g id="zoom"><rect class="fr" x="4" y="2" width="1128" height="891" rx="10"/><rect class="frt" x="4" y="2" width="472" height="18" rx="2"/><text class="frn" x="12" y="14.5">«view» mrtmAlarmStates : StandardViewDefinitions::StateTransitionView</text><g class="nd" tabindex="0" role="button" aria-pressed="false" aria-label="state def AlarmStates" data-el="MrtmSwStates::AlarmStates" data-x="24" data-y="44" data-w="1088" data-h="829" transform="translate(24,44)"><rect class="bx" width="1088" height="829" rx="2"/><rect class="hd" x="1" y="1" width="1086" height="33" rx="1"/><text class="kk kw" x="544" y="11.5" text-anchor="middle">«state def»</text><text class="nn bd" x="544" y="27" text-anchor="middle">AlarmStates</text><path class="rule" d="M0,712 H1088"/><text class="kk cl" x="544" y="722" text-anchor="middle">doc</text><text class="ft" x="7" y="736">One per alarm manager. Every 1 s cycle the</text><text class="ft" x="7" y="751">alarm task runs one step of this machine</text><text class="ft" x="7" y="766">and beats the heartbeat (MRTM-SAF-010).</text><path class="rule" d="M0,778 H1088"/><text class="kk cl" x="544" y="788" text-anchor="middle">attributes</text><text class="ft" x="7" y="802">silencedSeconds : Natural</text><text class="ft" x="7" y="817">realarmSeconds : Natural</text><g class="nd in wk" aria-label="initial transition, unnamed" data-x="560" data-y="96" data-w="18" data-h="18" transform="translate(536,52)"><circle cx="9" cy="9" r="9" fill="var(--ink)"/></g><g class="nd in" data-el="MrtmSwStates::AlarmStates::quiet" data-inner="1" aria-pressed="false" aria-label="state quiet" data-x="480" data-y="164" data-w="176" data-h="103" transform="translate(456,120)"><rect class="bx" width="176" height="103" rx="10"/><rect class="hd" x="1" y="1" width="174" height="33" rx="1"/><text class="kk kw" x="88" y="11.5" text-anchor="middle">«state»</text><text class="nn bd" x="88" y="27" text-anchor="middle">quiet</text><path class="rule" d="M0,35 H176"/><text class="kk cl" x="88" y="45" text-anchor="middle">state actions</text><text class="ft" x="7" y="59">entry buzzerOffLedGreen</text></g><g class="nd in" data-el="MrtmSwStates::AlarmStates::sounding" data-inner="1" aria-pressed="false" aria-label="state sounding" data-x="636" data-y="320" data-w="300" data-h="184" transform="translate(612,276)"><rect class="bx" width="300" height="184" rx="10"/><rect class="hd" x="1" y="1" width="298" height="33" rx="1"/><text class="kk kw" x="150" y="11.5" text-anchor="middle">«state»</text><text class="nn bd" x="150" y="27" text-anchor="middle">sounding</text><path class="rule" d="M0,35 H300"/><text class="kk cl" x="150" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">Buzzer continuous, red LED 2 Hz, warning</text><text class="ft" x="7" y="74">on screen (MRTM-SYS-003/004/005), within 5</text><text class="ft" x="7" y="89">s of confirmation.</text><path class="rule" d="M0,101 H300"/><text class="kk cl" x="150" y="111" text-anchor="middle">state actions</text><text class="ft" x="7" y="125">entry startAlarm</text><text class="ft" x="7" y="140">do checkBuzzerCurrent</text></g><g class="nd in" data-el="MrtmSwStates::AlarmStates::silenced" data-inner="1" aria-pressed="false" aria-label="state silenced" data-x="480" data-y="556" data-w="288" data-h="184" transform="translate(456,512)"><rect class="bx" width="288" height="184" rx="10"/><rect class="hd" x="1" y="1" width="286" height="33" rx="1"/><text class="kk kw" x="144" y="11.5" text-anchor="middle">«state»</text><text class="nn bd" x="144" y="27" text-anchor="middle">silenced</text><path class="rule" d="M0,35 H288"/><text class="kk cl" x="144" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">Buzzer off within 1 s of the button</text><text class="ft" x="7" y="74">(MRTM-SYS-006); red LED and warning stay</text><text class="ft" x="7" y="89">(MRTM-SYS-007); re-sounds after 15 min</text><text class="ft" x="7" y="104">(MRTM-SYS-019).</text><path class="rule" d="M0,116 H288"/><text class="kk cl" x="144" y="126" text-anchor="middle">state actions</text><text class="ft" x="7" y="140">entry stopBuzzerLogAck</text></g><g class="nd in" data-el="MrtmSwStates::AlarmStates::probeFault" data-inner="1" aria-pressed="false" aria-label="state probeFault" data-x="40" data-y="320" data-w="300" data-h="169" transform="translate(16,276)"><rect class="bx" width="300" height="169" rx="10"/><rect class="hd" x="1" y="1" width="298" height="33" rx="1"/><text class="kk kw" x="150" y="11.5" text-anchor="middle">«state»</text><text class="nn bd" x="150" y="27" text-anchor="middle">probeFault</text><path class="rule" d="M0,35 H300"/><text class="kk cl" x="150" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">Pattern 1 s on / 1 s off (MRTM-SAF-011),</text><text class="ft" x="7" y="74">probe fault message (MRTM-SYS-013), within</text><text class="ft" x="7" y="89">5 s (MRTM-SAF-002).</text><path class="rule" d="M0,101 H300"/><text class="kk cl" x="150" y="111" text-anchor="middle">state actions</text><text class="ft" x="7" y="125">entry startProbeFaultPattern</text></g><g class="nd in" data-el="MrtmSwStates::AlarmStates::buzzerFault" data-inner="1" aria-pressed="false" aria-label="state buzzerFault" data-x="816" data-y="556" data-w="280" data-h="154" transform="translate(792,512)"><rect class="bx" width="280" height="154" rx="10"/><rect class="hd" x="1" y="1" width="278" height="33" rx="1"/><text class="kk kw" x="140" y="11.5" text-anchor="middle">«state»</text><text class="nn bd" x="140" y="27" text-anchor="middle">buzzerFault</text><path class="rule" d="M0,35 H280"/><text class="kk cl" x="140" y="45" text-anchor="middle">doc</text><text class="ft" x="7" y="59">Red LED 4 Hz within 5 s (MRTM-SAF-015);</text><text class="ft" x="7" y="74">the backup alarm stays armed.</text><path class="rule" d="M0,8